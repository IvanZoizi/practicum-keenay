databaseChangeLog:
  - changeSet:
      id: 3
      author: your_name
      changes:
        # Создаем последовательность для id
        - createSequence:
            sequenceName: confirmation_token_seq
            startValue: 1
            incrementBy: 1

        # Создаем таблицу
        - createTable:
            tableName: confirmation_token
            columns:
              - column:
                  name: id
                  type: bigint
                  defaultValueComputed: nextval('confirmation_token_seq')
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: token
                  type: varchar(255)
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_confirmation_token_user
                    references: users(id)
              - column:
                  name: expires_at
                  type: timestamp
                  constraints:
                    nullable: false