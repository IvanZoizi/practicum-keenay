services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      - POSTGRES_DB=dbPracticum
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=dbPracticum
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    ports:
      - "5431:5432"  # Пробрасываем порт на localhost
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d dbPracticum" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: